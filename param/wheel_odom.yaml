wheel_odom_node:
  ros__parameters:
    # Input topics
    wheel_spd_input_topic: "kitti/oxts/gps/vel"
    imu_input_topic: "kitti/vehicle/imu"

    # Output topic
    wheel_odom_output_topic: "kitti/wheel_odom"

    # Queue sizes
    queue_size: 10        # QoS depth for subscribers/publishers
    sync_queue_size: 10   # ApproximateTime synchronizer queue size
